# credentials keep their own username. The default is { scheme = "bearer" };
# GitLab accepts only Basic:
# upstream_token_auth = { scheme = "basic", username = "oauth2" }
# redirect_policy = "none"
# request_body_max_bytes = 536870912
# response_body_max_bytes = 536870912
