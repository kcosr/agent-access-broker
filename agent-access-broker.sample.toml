# Development-oriented sample for local smoke testing.
#
# Do not copy this file directly into production. It intentionally uses
# environment = "development", anonymous identity, and service credential grants
# so the local provider examples are easy to exercise.
# For managed production deployment, start with
# agent-access-broker.production.sample.toml and docs/operator-guide.md.
# That template uses required identity, managed broker tokens, deny-by-default
# policy, and dedicated broker-owned state directories.

[deployment]
environment = "development"
# node_id names this broker in audit records (nodeId) and state-lock metadata.
# It defaults to the host name; set it explicitly where host names are not
# stable (containers) or not unique. 1 to 128 characters matching
# ^[A-Za-z0-9][A-Za-z0-9._-]*$. Changing it requires a restart.
# node_id = "broker-dev-1"

# All Broker outbound HTTPS uses native system roots by default. To add an
# organization CA, select system_plus_custom and an absolute PEM bundle path.
# custom trusts only that bundle. All modes verify chains and hostnames.
# [network.outbound_tls]
# trust = "system_plus_custom"
# ca_certificate = "/etc/agent-access-broker/ca/organization.pem"

# Optional global outbound proxy for broker-owned upstream traffic. Provider or
# configured-service proxy blocks can override this global default, while process
# environment proxy variables take precedence at runtime.
#
# [network.egress_proxy]
# url = "http://proxy.example:8080"
#
# Proxy credentials, when needed, must use an HTTPS proxy URL:
#
# [network.egress_proxy]
# url = "https://proxy.example:8443"
# username_ref = "env:EGRESS_PROXY_USERNAME"
# password_ref = "env:EGRESS_PROXY_PASSWORD"

# Optional downstream MCP on the public listener behind trusted TLS ingress.
# Requires the Authorization Bearer identity source below. Local file tools stay
# in `agent-access mcp serve`; HTTP exposes JSON actions and discovery helpers.
# /mcp/<service> and `mcp serve --service <service>` expose one service with raw names.
# Keep public_url at /mcp; proxy rules must allow both paths with the same protections.
# All HTTP views share session/control limits. Allow headroom for multiple clients
# and service connections, including overlapping sessions after a restart.
# [mcp]
# enabled = true
# public_url = "https://broker.example.com/mcp"
# allowed_origins = [] # Native clients omit Origin; reject every present Origin.
# operation_timeout_ms = 120000
# protocol_timeout_ms = 30000

# Database-managed upstream integrations (requires managed identity/policy/store,
# management.enabled, and credential encryption). Disabled by default.
[imports]
enabled = false
allowed_kinds = ["mcp_http", "openapi_http", "command"]
# OpenAPI requires both its API base URL and document URL to be allowed.
# See docs/imported-openapi.md for an example.
allowed_endpoints = [] # For example ["https://tools.internal.example/mcp"].
disabled_services = []

# Operator-approved local executables for the `command` import kind, named by
# imports as `command:<name>`. Requires "command" in imports.allowed_kinds.
# See docs/configuration.md#command-imports.
# [command_imports.ticketing]
# path = "/opt/agent-commands/ticketing/bin/ticketing-command"
# timeout = "30s"            # default 30s, max 10m
# max_output_bytes = 1048576 # default 1 MiB
# max_concurrent = 4         # default 4
# working_dir = "/"          # default "/"
# network = "inherit"        # default; or "none"
# log_stderr = false         # default
# [command_imports.ticketing.env]
# PATH = "/usr/local/bin:/usr/bin:/bin"

[identity]
mode = "anonymous"
authority = "toml"

# Context and fingerprint headers always require a valid named trusted caller
# credential on both public and Git listeners, even with no callers configured.
# Asserted callers replace client X-Agent-Access-Context values with an approved
# context; fixed callers omit that header and receive their configured context.
# Keep a conservative default for header-free direct clients, or omit
# default_context to require caller-attested context on governed requests.
[execution_context]
allowed_values = ["default", "workstation", "internal", "external"]
default_context = "default"

# Example required static identity source. Keep mode = "anonymous" for local
# smoke tests; switch to mode = "required" and uncomment this block when using
# broker-issued/local opaque tokens.
#
# [[identity.sources]]
# name = "local"
# type = "static_principals"
# header = "Authorization"
# scheme = "Bearer"
#
# [[identity.sources.principals]]
# principal = "alice"
# token_refs = ["file:/run/agent-access/alice.token"]
#
# [[identity.groups]]
# id = "agent-users"
# status = "active"
# members = ["alice"]

# Managed broker tokens can be resolved from the managed SQLite store instead
# of from static config. Broker tokens are hashed in SQLite; raw token values
# are returned only once by the admin token-issue API.
# Set identity.authority = "managed" before enabling this block.
#
# [[identity.sources]]
# name = "managed"
# type = "broker_tokens"
# header = "Authorization"
# scheme = "Bearer"
#
# [managed_store]
# type = "sqlite"
# path = "/var/lib/agent-access-broker/managed-store.sqlite3"
# require_registered_principal_for_invocation = true
# auto_migrate = false
# `serve` startup and reload admission lock a sibling
# <database-file>.agent-access.lock file before opening or migrating the
# managed store.
# Set auto_migrate = true only during an intentional startup create or schema
# migration, then return it to false for steady-state operation.
#
# Configuring managed_store requires credential_encryption for identity inventory.
# [credential_encryption]
# active_key = "k2026-06"
#
# [[credential_encryption.keys]]
# id = "k2026-06"
# provider = "env"
# env = "AGENT_ACCESS_CREDENTIAL_KEY_K2026_06"
#
# [broker_tokens]
# hash_key_ref = "env:AGENT_ACCESS_BROKER_TOKEN_HASH_KEY"
# default_agent_invoke_ttl = "30d"
# default_user_manage_ttl = "2h"
# default_admin_ttl = "2h"
# max_self_issued_agent_invoke_ttl = "30d"
# self_agent_invoke_ttl_options = ["8h", "7d", "30d"]
# admin_agent_invoke_ttl_options = ["8h", "7d", "30d", "never"]
# user_manage_ttl_options = ["30m", "2h", "8h", "1d"]
# admin_ttl_options = ["30m", "2h", "8h", "1d"]
#
# [browser_auth]
# enabled = true
# public_origin = "http://localhost:8080"
# session_cookie_name = "aab_session"
# csrf_header = "X-Agent-Access-CSRF"
# csrf_key_ref = "env:AGENT_ACCESS_BROWSER_CSRF_KEY"
# session_ttl = "8h"
# allowed_return_paths = ["/ui"]
#
# [browser_auth.local_password]
# enabled = true
# pepper_ref = "env:AGENT_ACCESS_LOCAL_PASSWORD_PEPPER"
# min_password_length = 12
# Failed attempts and lockouts count per principal and client source
# (IPv4 address or IPv6 /64); a lockout never blocks other sources.
# max_failed_attempts = 10
# lockout_ttl = "15m"
#
# Optional single-tenant Microsoft Entra browser login. This requires the
# managed identity/store/broker-token/management/browser/local-password blocks
# above. Register a single-tenant Web application in Entra with the exact
# callback derived from public_origin, for example:
# http://localhost:8080/v1/auth/oidc/microsoft/callback
# Use authorization code flow, leave implicit grants disabled, set
# groupMembershipClaims = "SecurityGroup", set Assignment required = Yes, and
# assign the intended users/groups. Do not grant Microsoft Graph permissions.
# Production public_origin and its exact registered callback must use HTTPS.
#
# [browser_auth.oidc.microsoft]
# enabled = true
# tenant_id = "00000000-0000-0000-0000-000000000000"
# client_id = "00000000-0000-0000-0000-000000000000"
# client_secret_ref = "env:AGENT_ACCESS_MICROSOFT_OIDC_CLIENT_SECRET"
# flow_key_ref = "env:AGENT_ACCESS_MICROSOFT_OIDC_FLOW_KEY"
# flow_ttl = "10m"
# max_pending_flows = 10000
# jit_provisioning = true
# external_membership_ttl = "8h"
#
# The client-secret ref contains the nonempty value issued by Entra. The flow
# key ref contains an independent unpadded base64url value that decodes to
# exactly 32 random bytes. Microsoft group Object IDs are mapped to existing
# broker groups through the admin API, CLI, or portal. Overage/distributed group
# claims deny that login; the broker does not call Graph. An already linked user
# may log in with a complete empty group list and retain any local access.
#
# [portal]
# enabled = true
# mount_path = "/ui"
# static_dir = "/var/lib/agent-access-broker/portal"
#
# [management]
# enabled = true
# admin_principals = ["ops-admin"]
# admin_groups = ["broker-admins"]
# allow_classless_admin_identities = true
# allow_classless_user_management = false
#
# [management.initial_admin]
# mode = "create_if_empty"
# principal_id = "admin"
# initial_password = "<insert-a-unique-generated-password>"
# Generate a unique password before enabling bootstrap; placeholder literals
# are rejected by configuration validation.
#
# allow_classless_admin_identities lets a configured static admin bootstrap
# the first managed principals and admin tokens. Turn it off after bootstrap
# when admin access should require managed admin broker tokens.
# management.initial_admin creates the first DB-backed admin only when the
# managed store has no principals, and the first login must reset the password.

[credentials.service.jira]
type = "basic_api_token"
username_ref = "env:JIRA_SERVICE_USERNAME"
token_ref = "env:JIRA_SERVICE_API_TOKEN"

# Optional per-user Jira execution credentials use the same local secret-store
# shape as Confluence. Per-user-only lookup-backed Jira policy can run without
# the separate read-only lookup credential below; service-mode lookup-backed
# policy still requires it.
#
# [credentials.per_user.jira]
# type = "secret_store"
# provider = "local_file"
# path = "/etc/agent-access/jira-user-credentials.json"
#
# Example local-file secret store:
#
# {
#   "credentials": [
#     {
#       "principal": "alice@example.com",
#       "type": "basic_api_token",
#       "username_ref": "env:JIRA_ALICE_USERNAME",
#       "token_ref": "env:JIRA_ALICE_API_TOKEN"
#     }
#   ]
# }
#
# Alternative managed-store Jira per-user credential shape. The credential row
# must exist in the managed store for the authenticated principal and the
# configured credential name.
#
# [credentials.per_user.jira]
# type = "managed_store"
# credential_name = "default"
# profile = "jira-cloud-api-token"

[credentials.lookup.jira]
type = "basic_api_token"
username_ref = "env:JIRA_LOOKUP_USERNAME"
token_ref = "env:JIRA_LOOKUP_API_TOKEN"
read_only = true

[credentials.service.confluence]
type = "basic_api_token"
username_ref = "env:CONFLUENCE_SERVICE_USERNAME"
token_ref = "env:CONFLUENCE_SERVICE_API_TOKEN"

[credentials.lookup.confluence]
type = "basic_api_token"
username_ref = "env:CONFLUENCE_LOOKUP_USERNAME"
token_ref = "env:CONFLUENCE_LOOKUP_API_TOKEN"
read_only = true

# Per-user-only lookup-backed Confluence policy can run without
# [credentials.lookup.confluence]. Service-mode lookup-backed policy still
# requires the separate read-only lookup credential.
#
# [credentials.per_user.confluence]
# type = "managed_store"
# credential_name = "default"
# profile = "confluence-cloud-api-token"

[credentials.service.gitlab]
type = "bearer_token"
token_ref = "env:GITLAB_SERVICE_TOKEN"

# CloudBees CI is optional. Grant cloudbees_ci_job resources and actions separately.
# [credentials.service.cloudbees_ci]
# type = "basic_api_token"
# username_ref = "env:CLOUDBEES_CI_USERNAME"
# token_ref = "env:CLOUDBEES_CI_API_TOKEN"
#
[credentials.lookup.gitlab]
type = "bearer_token"
token_ref = "env:GITLAB_LOOKUP_TOKEN"
read_only = true

# [credentials.per_user.gitlab]
# type = "managed_store"
# credential_name = "default"
# profile = "gitlab-access-token"

# GitLab's Git HTTP endpoint accepts only HTTP Basic credentials. Use the
# access token with any non-empty username, such as oauth2; a deploy token
# needs its own username.
#
# [credentials.service.gitlab_git]
# type = "basic_api_token"
# username_ref = "env:GITLAB_GIT_USERNAME"
# token_ref = "env:GITLAB_SERVICE_TOKEN"
#
# [credentials.per_user.gitlab_git]
# type = "managed_store"
# credential_name = "default"
# profile = "git-basic-api-token"
#
# Alternatively, keep token-only credentials and have the gateway present the
# token as Basic: set upstream_token_auth on [gateways.gitlab_git] below.
#
# [credentials.service.gitlab_git]
# type = "bearer_token"
# token_ref = "env:GITLAB_SERVICE_TOKEN"
#
# [credentials.per_user.gitlab_git]
# type = "managed_store"
# credential_name = "default"
# profile = "git-bearer-token"

[policy]
authority = "toml"
default_decision = "deny"

# Optional visible write attribution. Missing or empty lists disable attribution.
# Patterns match broker attribution capabilities for the provider, not every
# provider action. `page.*` includes attribution-capable page draft and comment
# actions. GitLab `merge_request.*` also includes direct inline/reply adds,
# draft adds, and publish-all/review-submit summaries; draft update remains
# non-attributed. Use exact action names for narrower behavior.
#
# [attribution.actions]
# jira = ["comment.*", "issue.create", "issue.child.create", "issue.update"]
# confluence = ["page.*", "blog.*"]
# gitlab = ["issue.*", "merge_request.*"]

# Resource selectors are shared by grants and token restrictions.
# Labels are optional. All and namespace entries include new upstream resources.

[[policy.resources]]
id = "jira-proj"
resource_type = "jira_project"
selector = { kind = "exact", value = "PROJ" }
allowed_execution_contexts = ["default", "internal", "external"]
enabled = true

[[policy.resources]]
id = "jira-ops"
resource_type = "jira_project"
selector = { kind = "exact", value = "OPS" }
allowed_execution_contexts = ["default", "internal", "external"]
enabled = true

[[policy.resources]]
id = "jira-all"
resource_type = "jira_project"
selector = { kind = "all" }
allowed_execution_contexts = ["internal"]
enabled = true

[[policy.resources]]
id = "confluence-eng"
resource_type = "confluence_space"
selector = { kind = "exact", value = "ENG" }
allowed_execution_contexts = ["default", "internal", "external"]
enabled = true

[[policy.resources]]
id = "confluence-all"
resource_type = "confluence_space"
selector = { kind = "all" }
allowed_execution_contexts = ["internal"]
enabled = true

[[policy.resources]]
id = "git-project"
resource_type = "git_repository"
selector = { kind = "exact", value = "team/project" }
allowed_execution_contexts = ["default", "internal", "external"]
enabled = true

[[policy.resources]]
id = "git-fork"
resource_type = "git_repository"
selector = { kind = "exact", value = "alice/project-fork" }
allowed_execution_contexts = ["default", "internal", "external"]
enabled = true

[[policy.resources]]
id = "git-team"
resource_type = "git_repository"
selector = { kind = "namespace", value = "team" }
allowed_execution_contexts = ["default", "internal", "external"]
enabled = true

[[policy.resource_groups]]
id = "engineering"
name = "Engineering"
included_resource_ids = ["jira-proj", "confluence-eng", "git-project"]
excluded_resource_ids = []

[[policy.grants]]
subjects = ["group:anonymous"]
service = "jira"
actions = ["issue_type.list", "issue.view", "issue.create", "issue.child.create", "issue.update", "issue.parent.set", "issue.dependency.add", "search", "comment.list", "comment.view", "comment.add", "comment.reply", "comment.update", "comment.delete", "comment.property.list", "comment.property.get", "comment.property.set", "comment.property.delete", "attachment.add", "attachment.list", "attachment.download", "verify"]
resources = { resource_group_ids = ["engineering"] }
execution_contexts = ["default"]
credential_mode = "service"

# Example per-user Jira grant. Enable only when [credentials.per_user.jira] is
# configured and the authenticated principal has a matching store record. This
# validates without [credentials.lookup.jira] only when no lookup-backed Jira
# grant uses credential_mode = "service".
#
# [[policy.grants]]
# subjects = ["user:alice@example.com"]
# service = "jira"
# actions = ["issue_type.list", "issue.view", "issue.create", "issue.child.create", "issue.update", "issue.parent.set", "issue.dependency.add", "search", "comment.list", "comment.view", "comment.add", "comment.reply", "comment.update", "comment.delete", "comment.property.list", "comment.property.get", "comment.property.set", "comment.property.delete", "attachment.add", "attachment.list", "attachment.download", "verify"]
# resources = { resource_ids = ["jira-ops"] }
# execution_contexts = ["external"]
# credential_mode = "per_user"
#
# Wildcard containment is supported for Jira project scope. Per-user-only
# lookup-backed object operations use the selected user's upstream credential
# for pre-authorization metadata lookup. Enable only when that upstream
# credential is intended to bound all reachable projects for the principal.
#
# [[policy.grants]]
# subjects = ["user:alice@example.com"]
# service = "jira"
# actions = ["issue_type.list", "issue.view", "issue.create", "issue.child.create", "issue.update", "issue.parent.set", "issue.dependency.add", "search", "comment.list", "comment.view", "comment.add", "comment.reply", "comment.update", "comment.delete", "comment.property.list", "comment.property.get", "comment.property.set", "comment.property.delete", "attachment.add", "attachment.list", "attachment.download", "verify"]
# resources = { resource_ids = ["jira-all"] }
# execution_contexts = ["internal"]
# credential_mode = "per_user"

[[policy.grants]]
subjects = ["group:anonymous"]
service = "confluence"
actions = ["page.view", "search", "page.create", "page.update", "page.move", "attachment.add", "attachment.list", "attachment.download", "verify"]
resources = { resource_group_ids = ["engineering"] }
execution_contexts = ["default"]
credential_mode = "service"

