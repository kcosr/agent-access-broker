# GitLab REST and Git HTTP use the same git_repository resource entries.
# Exact, nested namespace, and all selectors are supported. Credentials do not
# replace the resource policy boundary.
# Owner-scoped pending-review participation should normally use per-user
# credentials so GitLab attributes drafts, reviewer state, and summaries to the
# human. This separate grant keeps draft CRUD/publication and review submission
# out of the broad service-account grant above; direct inline/reply actions in
# that example intentionally remain bot comments.
#
# [[policy.grants]]
# subjects = ["user:alice@example.com"]
# service = "gitlab"
# actions = [
#   "merge_request.draft_note.list",
#   "merge_request.draft_note.view",
#   "merge_request.draft_note.add",
#   "merge_request.draft_note.update",
#   "merge_request.draft_note.delete",
#   "merge_request.draft_note.publish",
#   "merge_request.draft_note.publish_all",
#   "merge_request.review.submit",
#   "merge_request.approval.view",
#   "merge_request.approval_state.view",
#   "merge_request.approval_rule.list",
#   "merge_request.approval_rule.view",
#   "merge_request.approve",
#   "merge_request.unapprove",
#   "merge_request.suggestion.apply",
#   "merge_request.suggestion.batch_apply",
# ]
# Suggestion application commits to the MR source branch. For a fork MR, one
# selected grant must therefore cover both the target and source repositories;
# grants are not combined. Same-project MRs need only the one repository.
# resources = { resource_ids = ["git-project", "git-fork"] }
# execution_contexts = ["internal"]
# credential_mode = "per_user"
#
# Service mode is also supported for an intentional bot reviewer. Every Broker
# principal sharing that credential then shares the bot-owned draft set and,
# when granted, can read, edit, delete, publish, or submit it. Do not describe
# such activity as the human principal's GitLab review.
#
# [[policy.grants]]
# subjects = ["group:git-users"]
# service = "gitlab_git"
# actions = ["repo.fetch", "repo.push"]
# resources = { resource_ids = ["git-project", "git-team"] }
# execution_contexts = ["internal"]
# credential_mode = "service"

# Development-only fake backend (fake.echo on fake_project resources) for local
# smoke tests; requires deployment.enable_fake_service = true.
# [providers.fake]

# [providers.cloudbees_ci]
# allowed_upstream_hosts = ["https://ci.example.com/team-ci/**"]
# max_log_scan_bytes = 16777216 # default 16 MiB; must be <= limits.max_upstream_response_bytes
#
# [providers.cloudbees_ci.controllers.team-ci]
# base_url = "https://ci.example.com/team-ci/"
# web_base_url = "https://ci-public.example.com/team-ci/" # optional public Jenkins root; no requests sent here
#
[providers.jira]
tenant_host = "example.atlassian.net"
cloud_id = "00000000-0000-0000-0000-000000000000"
allowed_upstream_hosts = [
  "https://example.atlassian.net/rest/api/3/**",
  "https://api.media.atlassian.com/**",
]

# [providers.jira.egress_proxy]
# url = "http://jira-proxy.example:8080"

[providers.jira.attachments]
max_bytes = 10485760
max_total_bytes = 52428800
max_download_bytes = 104857600
media_types = ["text/plain", "text/markdown", "application/json", "image/png", "text/html"]

[providers.jira.content]
comment_formats = ["adf"]
# Bounds caller-supplied rich-content writes and every declared native Jira body
# returned by reads or mutation readbacks, including native response mode.
max_body_bytes = 1048576

[providers.jira.search]
max_results = 50

[providers.jira.comments]
max_results = 50
max_property_value_bytes = 32768
allowed_property_key_prefixes = ["agent-access."]

[providers.jira.issue_links]
