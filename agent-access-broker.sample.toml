[providers.confluence]
tenant_host = "example.atlassian.net"
cloud_id = "00000000-0000-0000-0000-000000000000"
allowed_upstream_hosts = [
  "https://example.atlassian.net/wiki/rest/api/**",
  "https://example.atlassian.net/wiki/api/v2/**",
  "https://example.atlassian.net/wiki/download/attachments/**",
  "https://api.media.atlassian.com/**",
]

# [providers.confluence.egress_proxy]
# url = "http://confluence-proxy.example:8080"

[providers.confluence.attachments]
max_bytes = 10485760
max_total_bytes = 52428800
max_download_bytes = 104857600
media_types = ["text/plain", "application/json", "image/png", "text/html", "text/markdown"]

[providers.confluence.content]
# Native write targets and returned read representations. Normalized reads
# preserve a returned native body and derive Markdown/text from present ADF
# first, otherwise storage. Storage also enables normalized writes.
page_formats = ["atlas_doc_format", "storage"]
blog_formats = ["storage"]
comment_formats = ["storage"]
max_body_bytes = 2097152

[providers.confluence.search]
max_results = 50

[providers.gitlab]
api_base_url = "https://gitlab.example.com/api/v4"
web_base_url = "https://gitlab.example.com"
allowed_upstream_hosts = ["https://gitlab.example.com/api/v4/**"]

# Explicit credential issuance for downstream review tools; see docs/gitlab-bot-provisioning.md.
# These caps apply in addition to independently granted repository-scoped actions.
[providers.gitlab.provisioning]
enabled = false
max_access_level = 30
max_token_lifetime_days = 30
allowed_token_scopes = ["api", "read_api", "read_repository"]

# Project webhook destination policy is operator-owned TOML, not grant or portal
# configuration. The empty default denies hook creation and URL-changing
# updates while still allowing separately granted operations on existing hooks.
[providers.gitlab.webhooks]
allowed_destinations = []
allow_disable_ssl_verification = false

# Example deployment policy (replace the empty list above rather than defining
# this table twice):
# allowed_destinations = [
#   "https://hooks.example.com/gitlab/**",
#   "http://hooks.internal.example/**", # explicit authorization for plaintext HTTP
# ]
# allow_disable_ssl_verification = false

# [providers.gitlab.egress_proxy]
# url = "http://gitlab-proxy.example:8080"

# One file per project.upload. Empty media_types allows all types, including
# text/html exported sessions; set an explicit list to restrict uploads.
[providers.gitlab.attachments]
max_bytes = 10485760
max_total_bytes = 52428800
media_types = []

[providers.gitlab.content]
max_body_bytes = 1048576
max_commit_actions = 25
max_file_bytes = 10485760
max_raw_download_bytes = 104857600

[providers.gitlab.search]
max_results = 50

