[limits]
request_body_timeout_ms = 300000
# Authentication, anonymous, and unauthenticated traffic budgets (fixed
# 60-second windows), checked before body extraction on control-plane routes.
# Authenticated API calls are limited per service below.
auth_requests_per_principal_per_minute = 100
auth_requests_per_source_per_minute = 300
max_concurrent_requests = 100
max_concurrent_requests_per_principal = 10
max_http_body_bytes = 536870912
max_download_bytes = 104857600
max_upstream_response_bytes = 536870912
request_timeout_ms = 30000
streaming_idle_timeout_ms = 30000
# Required; there is no default. Use broker-owned disk-backed storage in
# production. A relative path resolves against the working directory. `serve`
# startup and reload admission lock this directory for the lifetime of the
# runtime generation.
upload_spool_dir = "target/agent-access-upload-spool"
upload_spool_max_bytes = 2147483648

# Service invocations (POST /v1/invoke, HTTP MCP action tools, and Git pack
# POSTs) are limited per principal and service in a rolling window. Discovery,
# runtime specs, management, and MCP protocol messages are not counted.
# Precedence: principal override -> service limit -> default -> 100 per 1m.
[limits.invocations]
default = { requests = 100, window = "1m" }

[limits.invocations.services.jira]
requests = 60
window = "1m"

# Principal overrides are only valid with identity.authority = "toml" and must
# name a configured static principal (or "anonymous"). Managed deployments
# store overrides in the managed store instead.
#
# [[limits.invocations.principal_overrides]]
# principal = "alice"
# service = "jira"
# requests = 10
# window = "1m"

# Omit [audit] to disable audit. type and path are required when it is present:
# - sqlite: a standalone SQLite audit database that the portal Audit/Activity
#   pages, `agent-access audit`, and /v1/audit/* can query (with [management]
#   enabled). `serve` creates it owner-only and migrates it at startup; reload
#   never creates or migrates one. With the broker stopped, check it with
#   `agent-access-broker --config <file> audit verify`.
# - jsonl: size-rotated JSON Lines files for log shippers; not queryable.
# path must not be the managed_store database. `serve` startup and reload admission
# lock a sibling <path>.agent-access.lock file before writing audit records.
# Changing type (including adding or removing [audit]) requires a restart.
[audit]
type = "sqlite"
path = "target/agent-access-broker-audit/audit.sqlite"
# JSONL alternative (rotate_bytes is valid only with type = "jsonl"):
# type = "jsonl"
# path = "target/agent-access-broker-audit/audit.jsonl"
# rotate_bytes = 104857600 # default
retention_days = 30
queue_capacity = 1024
# terminal_queue_capacity defaults to limits.max_concurrent_requests. If set
# explicitly, it must be at least that limit so each accepted streaming
# response has reserved capacity for its terminal audit.
# terminal_queue_capacity = 100
enqueue_timeout_ms = 1000
durability = "write" # write | sync_data | sync_all

# Trusted callers authenticate attesters separately from end principals.
# Username and fingerprint identity require managed identity/storage/encryption.
# Direct username mode is HTTP MCP only; the launcher controls BOTH protected
# headers. Explicit bindings are created through administration, never inferred.
# [identity.trusted_callers.managed_client]
# credential_ref = "file:/run/secrets/managed-client-attestation"
# credential_transport = "authorization_user"
# username_namespace = "managed_workspace"
# context_mode = "fixed"
# execution_context = "internal"
#
# [identity.trusted_callers.identity_ingress]
# credential_ref = "file:/run/secrets/ingress-attestation"
# credential_transport = "caller_authorization" # default transport
# username_namespace = "managed_workspace" # optional username capability
# context_mode = "asserted"
# allowed_execution_contexts = ["internal", "external"]
# allow_forwarded_identity = true # fingerprint capability only
#
# Context-only callers still need an ordinary principal credential.
# [identity.trusted_callers.job_runner]
# credential_ref = "file:/run/secrets/job-runner-attestation"
# context_mode = "fixed"
# execution_context = "internal"
#
# Direct username: Authorization: Bearer <direct caller credential> and
# X-Agent-Access-User: alice. Omit X-Agent-Access-Context (context is fixed).
# Relay username: X-Agent-Access-Caller-Authorization: Bearer <relay credential>
# and X-Agent-Access-User: alice, plus approved context for an asserted caller.
# Fingerprint: dedicated caller header and X-AW-Identity-Token-SHA256:
# sha256:<64 lowercase hex>. Never combine usernames and fingerprints.
# Fixed callers omit context. MCP rejects all request trailers. Other routes,
# including Git and REST, reject X-Agent-Access-User.
# In each Git [gateways.<service>] table, optionally add:
# allow_forwarded_identity = true # permits token-free fingerprint identity
# Secrets for username callers are 16–8192 visible ASCII bytes without commas or
# whitespace, distinct from each other and static principal credentials.
# Direct secrets cannot start with aab_. See docs/trusted-callers.md.

# Optional delegated OAuth test provider (non-production only). Requires managed
# identity/store/encryption, browser auth, management and enable_fake_service.
# The records backend and the stub registration point at the same test server;
# base_url must be a literal loopback IP origin.
# Full runnable harness and separate provider setup: docs/oauth.md.
# [providers.oauth_stub]
# base_url = "http://127.0.0.1:8099"
# [oauth.registrations.stub]
# adapter = "stub"
# base_url = "http://127.0.0.1:8099"
# redirect_uri = "http://127.0.0.1:8080/v1/oauth/callback/stub"
# client_id = "broker-local"
# client_secret_ref = "env:OAUTH_STUB_CLIENT_SECRET"
# allow_insecure_loopback = true
# [oauth.registrations.stub.permission_profiles.read]
# scopes = ["records.read", "offline_access"]
# audience = "records-api"
# target = "workspace-one"
# [credentials.per_user.oauth_stub]
# type = "oauth"
# provider = "stub"
# profile = "read"

# Imported MCP OAuth: add to a managed/browser-enabled deployment and allow the
# exact endpoint in [imports] with allowed_kinds = ["mcp_http"]. Configure the
# imported service's personal OAuth binding in the portal. See docs/imported-oauth.md.
# [oauth.registrations.internal_tools]
# adapter = "mcp_oauth"
# base_url = "https://login.example.com/issuer"
# redirect_uri = "https://broker.example.com/v1/oauth/callback/internal_tools"
# client_id = "registered-broker-client"
# client_auth = "none"
# rotation = "preserve_old"
#
# [oauth.registrations.internal_tools.adapter_settings]
# resource = "https://tools.example.com/mcp"
# protected_resource_metadata_url = "https://tools.example.com/.well-known/oauth-protected-resource/mcp"
# authorization_server_metadata_url = "https://login.example.com/.well-known/oauth-authorization-server/issuer"
# authorization_endpoint = "https://login.example.com/authorize"
# token_endpoint = "https://login.example.com/token"
#
# [oauth.registrations.internal_tools.permission_profiles.default]
# scope_mode = "server_default"
# audience = "https://tools.example.com/mcp"
# target = "https://tools.example.com/mcp"
# Do not set scopes in server_default mode, even to an empty list. All profiles
# in a registration use one mode. For explicit permissions, omit scope_mode (or
# set it to "explicit") and supply a nonempty scopes list, such as ["tools.read"].

