[workspace]
members = [
  "crates/agent-access",
  "crates/agent-access-broker",
  "crates/agent-access-broker-host",
  "crates/agent-access-cloudbees-ci",
  "crates/agent-access-command-import",
  "crates/agent-access-confluence",
  "crates/agent-access-atlassian",
  "crates/agent-access-content",
  "crates/agent-access-conformance",
  "crates/agent-access-core",
  "crates/agent-access-fake",
  "crates/agent-access-gitlab",
  "crates/agent-access-gmail",
  "crates/agent-access-jira",
  "crates/agent-access-provider",
  "crates/agent-access-mcp-upstream",
  "crates/agent-access-openapi-upstream",
  "crates/agent-access-teams",
]
# Templates staged as independent repositories by
# scripts/verify-downstream-consumer.mjs; each has its own workspace root.
exclude = ["tests/downstream-consumer"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.2.0"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
arc-swap = "1.7"
async-trait = "0.1"
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.22"
bytes = "1.10"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
html5ever = "0.35"
http = "1.3"
hyper = "1"
hyper-util = { version = "0.1", features = ["http1", "server", "service", "tokio"] }
jsonschema = { version = "0.46.6", default-features = false }
libc = "0.2"
mime_guess = "2.0"
markup5ever_rcdom = "0.35"
openidconnect = { version = "4.0.1", default-features = false, features = ["reqwest", "rustls-tls"] }
percent-encoding = "2.3"
pulldown-cmark = "0.13"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
rmcp = { version = "=3.4.1", default-features = false, features = ["server", "transport-io"] }
rpassword = "7.4"
rusqlite = { version = "0.40.1", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-native-certs = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.48", features = ["fs", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
toml = "0.9"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
unicode-general-category = "1.1"
url = "2.5"
uuid = { version = "1.11", features = ["v4", "v7", "serde"] }
filetime = "0.2"
futures-util = "0.3"
http-body-util = "0.1"
tempfile = "3.23"
wiremock = "0.6"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_SystemInformation"] }
argon2 = "0.5"

# Keep production password parameters in tests without paying for an
# unoptimized memory-hard implementation on every fixture login.
[profile.test.package.argon2]
opt-level = 3

[profile.test.package.blake2]
opt-level = 3

# Schema-heavy fixtures use bundled SQLite; optimize its C implementation
# while retaining debug assertions and normal durability in workspace code.
[profile.test.package.libsqlite3-sys]
opt-level = 3
