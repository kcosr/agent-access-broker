[sources]
include = ["**/*"]
exclude = [
    ".git/**",
    ".build-service/**",
    "target/**",
    "apps/portal/node_modules/**",
    "apps/portal/dist/**",
    "*.html",
]

[artifacts]
include = [
    "Cargo.toml",
    "Cargo.lock",
    "crates/**/Cargo.toml",
    "crates/**/*.rs",
    ".rustfmt.toml",
    "rustfmt.toml",
    "target/debug/agent-access",
    "target/debug/agent-access-broker",
    "target/release/agent-access",
    "target/release/agent-access-broker",
    "target/*/debug/agent-access",
    "target/*/debug/agent-access-broker",
    "target/*/debug/agent-access.exe",
    "target/*/debug/agent-access-broker.exe",
    "target/*/release/agent-access",
    "target/*/release/agent-access-broker",
    "target/*/release/agent-access.exe",
    "target/*/release/agent-access-broker.exe",
    "target/fake-broker-audit/**",
    "apps/portal/dist/**",
    "apps/portal/test-results/**",
    "apps/portal/playwright-report/**",
]
exclude = []

[connection]
enabled = false

[request]
timeout_sec = 1800

[workspace]
reuse = true
id = "{repo}-{branch}-{uid}"
create = true
ttl_sec = 86400

[output]
capture_logs = true
log_dir = "/tmp/build-service/agent-access-broker-logs"
stdout_max_lines = 2000
stderr_max_lines = 2000
stdout_tail_lines = 80
stderr_tail_lines = 80
