nextest-version = "0.9.150"

[profile.default]
test-threads = 16
retries = 0
fail-fast = false
# Bound a stuck test while allowing real filesystem and subprocess fixtures
# time to finish on shared hosts. Test-specific timeout assertions remain local.
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.ci]
inherits = "default"

[profile.ci.junit]
path = "junit.xml"
